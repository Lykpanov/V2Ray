<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Эрудит — Викторина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
        }

        /* Экран старта */
        #screen-start {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 24px;
            padding: 20px;
        }

        .logo-box {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .rules-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            text-align: left;
            backdrop-filter: blur(12px);
        }

        .rules-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .rules-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .rules-list li span {
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* Игровой экран */
        #screen-game {
            display: none;
            flex: 1;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        .score-box {
            font-size: 16px;
            font-weight: 700;
        }

        .score-val {
            color: var(--accent);
        }

        .timer-box {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timer-val {
            color: var(--text-color);
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 100%;
            transition: width 1s linear, background-color 0.3s;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-color);
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: var(--success) !important;
            color: #4ade80 !important;
        }

        .option-btn.incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--error) !important;
            color: #f87171 !important;
        }

        .game-footer {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-skip {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
        }

        /* Анимация всплывающих баллов */
        .score-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }
        .score-badge.show {
            opacity: 1;
            transform: translateY(0);
        }
        .score-badge.plus { background: rgba(34, 197, 94, 0.9); color: #fff; }
        .score-badge.minus-two { background: rgba(239, 68, 68, 0.9); color: #fff; }
        .score-badge.minus-one { background: rgba(245, 158, 11, 0.9); color: #fff; }
    </style>
</head>
<body>

    <div id="scoreBadge" class="score-badge">+1</div>

    <div class="container">
        <!-- Экран старта -->
        <div id="screen-start">
            <div class="logo-box">🧠</div>
            <div>
                <h1>ЭРУДИТ</h1>
                <p style="color: var(--text-secondary); font-size: 14px; margin-top: 6px;">Интеллектуальная викторина</p>
            </div>
            
            <div class="rules-card">
                <h3>Правила игры:</h3>
                <ul class="rules-list">
                    <li><span>15 секунд</span> на раздумье над каждым вопросом.</li>
                    <li><span>+1 балл</span> за правильный ответ.</li>
                    <li><span>-2 балла</span> за ошибку.</li>
                    <li><span>-1 балл</span> за пропуск или истечение времени.</li>
                    <li><span>Без повторов</span> — вопросы никогда не повторяются!</li>
                </ul>
            </div>

            <button class="btn-primary" onclick="startGame()">Начать игру</button>
        </div>

        <!-- Игровой экран -->
        <div id="screen-game">
            <div class="header">
                <div class="score-box">Счёт: <span id="scoreVal" class="score-val">0</span></div>
                <div class="timer-box">
                    <span>⏱️</span>
                    <span id="timerVal" class="timer-val">15с</span>
                </div>
            </div>

            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>

            <div class="question-card">
                <div>
                    <div id="questionText" class="question-text">Загрузка вопроса...</div>
                    <div id="optionsList" class="options-list"></div>
                </div>

                <div class="game-footer">
                    <button class="btn-skip" onclick="skipQuestion()">Пропустить (-1)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let score = 0;
        let timeLeft = 15;
        const maxTime = 15;
        let timerInterval = null;
        let currentQuestion = null;
        let isAnswerLocked = false;
        let usedHashes = new Set();

        // База вопросов
        const baseQuestions = [
            { q: "Какая планета является самой большой в Солнечной системе?", options: ["Юпитер", "Сатурн", "Нептун", "Земля"], answer: 0 },
            { q: "Какой газ преобладает в атмосфере Земли?", options: ["Кислород", "Азот", "Углекислый газ", "Аргон"], answer: 1 },
            { q: "В каком году человек впервые ступил на Луну?", options: ["1965", "1969", "1971", "1975"], answer: 1 },
            { q: "Какая столица у Австралии?", options: ["Сидней", "Мельбурн", "Канберра", "Брисбен"], answer: 2 },
            { q: "Сколько костей в теле взрослого человека?", options: ["186", "206", "226", "246"], answer: 1 },
            { q: "Какой химический элемент обозначается символом 'Au'?", options: ["Серебро", "Медь", "Золото", "Аллюминий"], answer: 2 },
            { q: "Кто написал роман «Война и мир»?", options: ["Достоевский Ф.М.", "Толстой Л.Н.", "Пушкин А.С.", "Чехов А.П."], answer: 1 },
            { q: "Какое самое глубокое озеро в мире?", options: ["Виктория", "Мертвое море", "Байкал", "Супериор"], answer: 2 },
            { q: "Сколько зубов у взрослого человека в норме?", options: ["28", "30", "32", "34"], answer: 2 },
            { q: "Какая самая длинная река в мире?", options: ["Нил", "Амазонка", "Янцзы", "Миссисипи"], answer: 1 }
        ];

        let questionsPool = [...baseQuestions];

        // Хеширование для защиты от повторов
        function getHash(str) {
            let hash = 2166136261;
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(16);
        }

        // Синхронизация с Telegram CloudStorage
        async function loadHistory() {
            try {
                const local = localStorage.getItem('erudit_used');
                if (local) JSON.parse(local).forEach(h => usedHashes.add(h));

                if (tg.CloudStorage) {
                    tg.CloudStorage.getItem('used_hashes', (err, val) => {
                        if (!err && val) {
                            try {
                                JSON.parse(val).forEach(h => usedHashes.add(h));
                            } catch(e){}
                        }
                    });
                }
            } catch(e) {}
        }

        function saveHistory(hash) {
            usedHashes.add(hash);
            try {
                const arr = Array.from(usedHashes);
                localStorage.setItem('erudit_used', JSON.stringify(arr));
                if (tg.CloudStorage) {
                    tg.CloudStorage.setItem('used_hashes', JSON.stringify(arr.slice(-300)));
                }
            } catch(e) {}
        }

        async function startGame() {
            await loadHistory();
            document.getElementById('screen-start').style.display = 'none';
            document.getElementById('screen-game').style.display = 'flex';
            nextQuestion();
        }

        function showBadge(text, type) {
            const badge = document.getElementById('scoreBadge');
            badge.innerText = text;
            badge.className = `score-badge show ${type}`;
            setTimeout(() => {
                badge.className = 'score-badge';
            }, 1000);
        }

        function updateScore(delta, badgeText, badgeType) {
            score += delta;
            document.getElementById('scoreVal').innerText = score;
            showBadge(badgeText, badgeType);
        }

        function nextQuestion() {
            clearInterval(timerInterval);
            isAnswerLocked = false;
            timeLeft = maxTime;
            updateTimerDisplay();

            // Ищем неиспользованный вопрос
            let available = questionsPool.filter(q => !usedHashes.has(getHash(q.q)));

            if (available.length === 0) {
                // Генератор уникальных задач на лету
                const randNum1 = Math.floor(Math.random() * 50) + 10;
                const randNum2 = Math.floor(Math.random() * 50) + 10;
                const sum = randNum1 + randNum2;
                currentQuestion = {
                    q: `Сколько будет ${randNum1} + ${randNum2}?`,
                    options: [sum, sum + 2, sum - 3, sum + 5].sort(() => Math.random() - 0.5),
                    answer: 0
                };
                currentQuestion.answer = currentQuestion.options.indexOf(sum);
            } else {
                currentQuestion = available[Math.floor(Math.random() * available.length)];
            }

            saveHistory(getHash(currentQuestion.q));

            // Рендер вопроса
            document.getElementById('questionText').innerText = currentQuestion.q;
            const optionsContainer = document.getElementById('optionsList');
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            const fill = document.getElementById('progressBar');
            fill.style.width = '100%';
            fill.style.backgroundColor = 'var(--accent)';

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timerVal').innerText = timeLeft + 'с';
            const fill = document.getElementById('progressBar');
            fill.style.width = `${(timeLeft / maxTime) * 100}%`;
            if (timeLeft <= 5) {
                fill.style.backgroundColor = 'var(--error)';
            }
        }

        function selectAnswer(selectedIndex, btnElement) {
            if (isAnswerLocked) return;
            isAnswerLocked = true;
            clearInterval(timerInterval);

            const buttons = document.querySelectorAll('.option-btn');
            const correctIndex = currentQuestion.answer;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                updateScore(1, '+1', 'plus');
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                btnElement.classList.add('incorrect');
                buttons[correctIndex].classList.add('correct');
                updateScore(-2, '-2', 'minus-two');
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            setTimeout(nextQuestion, 1200);
        }

        function handleTimeout() {
            if (isAnswerLocked) return;
            isAnswerLocked = true;

            const buttons = document.querySelectorAll('.option-btn');
            buttons[currentQuestion.answer].classList.add('correct');

            updateScore(-1, '-1', 'minus-one');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');

            setTimeout(nextQuestion, 1200);
        }

        function skipQuestion() {
            if (isAnswerLocked) return;
            isAnswerLocked = true;
            clearInterval(timerInterval);

            updateScore(-1, '-1', 'minus-one');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            nextQuestion();
        }
    </script>
</body>
</html>
